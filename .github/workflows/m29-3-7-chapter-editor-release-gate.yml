name: M29.3 Chapter Editor Release Gate

on:
  push:
    branches:
      - feat/nqa-m29-3-chapter-editor
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m29-3-7-chapter-editor-release-gate
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ipenovel_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ipenovel_test
      VITE_PAYMENT_QR_IMAGE_URL: https://pub-example.r2.dev/payment/qr.jpg
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ipenovel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare disposable test database and apply migrations
        run: pnpm test:db:prepare

      - name: Full NQA and Workspace unit regression
        run: >-
          pnpm exec vitest run -c vitest.config.ts
          server/nqa
          server/workspace
          client/src/pages/workspaceChapterEditor.test.ts
          server/migration-deployment-safety.test.ts

      - name: Full Workspace integration regression
        run: >-
          pnpm exec vitest run -c vitest.integration.config.ts
          server/workspace

      - name: Chapter Editor edit to QC to Confirm Stage release gate
        run: >-
          pnpm exec vitest run -c vitest.integration.config.ts
          server/workspace/editorialChapterEditorReleaseGate.service.integration.test.ts

      - name: Typecheck
        run: pnpm check

      - name: Production build
        run: pnpm build

      - name: Migration 0060 and diff safety
        shell: bash
        run: |
          set -euo pipefail
          test -f drizzle/0060_workspace_editorial_structural_confirmations.sql
          grep -q 'workspaceEditorialStructuralConfirmations' drizzle/0060_workspace_editorial_structural_confirmations.sql
          if grep -Eiq 'DROP[[:space:]]+(TABLE|COLUMN|FOREIGN KEY)' drizzle/0060_workspace_editorial_structural_confirmations.sql; then
            echo "Migration 0060 contains a destructive DROP statement"
            exit 1
          fi
          git diff --check c5742e7802bc250cc1e198f0de7774eaa2c2ca0b...HEAD
          changed="$(git diff --name-only c5742e7802bc250cc1e198f0de7774eaa2c2ca0b...HEAD)"
          if [ -n "$changed" ] && git grep -n $'\uFFFD' -- $changed; then
            echo "U+FFFD replacement character found in changed files"
            exit 1
          fi
          if git diff --unified=0 c5742e7802bc250cc1e198f0de7774eaa2c2ca0b...HEAD | grep -E '^\+.*BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo "Private key material detected in diff"
            exit 1
          fi
          if ! git diff --quiet c5742e7802bc250cc1e198f0de7774eaa2c2ca0b...HEAD -- package.json pnpm-lock.yaml; then
            echo "Dependency delta vs M29.3 baseline detected - evaluating exception policy..."
            APPROVED_PKG_BLOB="69f7972e1d3f7eaa6052310318134c8bbc0fe785"
            APPROVED_LOCK_BLOB="b4a01df0852a348833da7408db65370d4889db46"
            RSC_BASE="01c9efef680a4f414ea15a9447ed0f1618ba9dba"
            R5_COMMIT="7e7fb0f0be5004f306767fdb55b49a4c4ff44ec9"
            RSC_EXCEPTION=0
            if [ "${GITHUB_REPOSITORY:-}" = "pattaramet-tech/ipenovel" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${GITHUB_BASE_REF:-}" = "main" ] && [ "${GITHUB_HEAD_REF:-}" = "feat/reader-session-controls" ]; then
              EVENT_HEAD_REPO="$(jq -r '.pull_request.head.repo.full_name // ""' "$GITHUB_EVENT_PATH")"
              EVENT_HEAD_SHA="$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")"
              if [ "$EVENT_HEAD_REPO" != "pattaramet-tech/ipenovel" ] || [ -z "$EVENT_HEAD_SHA" ] || ! git merge-base --is-ancestor "$RSC_BASE" "$EVENT_HEAD_SHA" || [ "$(git rev-parse HEAD^2 2>/dev/null || true)" != "$EVENT_HEAD_SHA" ]; then
                echo "Reader Session Controls exception denied: provenance mismatch (head repo/sha or merge parents)"
                exit 1
              fi
              if [ "$(git rev-parse "$EVENT_HEAD_SHA:package.json")" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse "$EVENT_HEAD_SHA:pnpm-lock.yaml")" != "$APPROVED_LOCK_BLOB" ] || [ "$(git rev-parse HEAD:package.json)" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse HEAD:pnpm-lock.yaml)" != "$APPROVED_LOCK_BLOB" ]; then
                echo "Reader Session Controls exception denied: dependency blob SHA mismatch"
                exit 1
              fi
              RSC_DELTA="$(git diff --name-only "$RSC_BASE" "$EVENT_HEAD_SHA" -- . ':(exclude).github/workflows/m29-3-7-chapter-editor-release-gate.yml')"
              if [ -n "$RSC_DELTA" ]; then
                echo "Reader Session Controls exception denied: unapproved changes after the reviewed commit:"
                echo "$RSC_DELTA"
                exit 1
              fi
              RSC_EXCEPTION=1
              echo "Reader Session Controls exception verified: approved dependency blobs (69f7972e/b4a01df0), reviewed commit is ancestor, workflow-only delta."
            elif [ "${GITHUB_REPOSITORY:-}" = "pattaramet-tech/ipenovel" ] && [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${GITHUB_REF:-}" = "refs/heads/feat/reader-session-controls" ] && [ "${GITHUB_SHA:-}" = "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor "$RSC_BASE" HEAD; then
              if [ "$(git rev-parse HEAD:package.json)" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse HEAD:pnpm-lock.yaml)" != "$APPROVED_LOCK_BLOB" ]; then
                echo "Reader Session Controls exception denied: dependency blob SHA mismatch"
                exit 1
              fi
              RSC_DELTA="$(git diff --name-only "$RSC_BASE" HEAD -- . ':(exclude).github/workflows/m29-3-7-chapter-editor-release-gate.yml')"
              if [ -n "$RSC_DELTA" ]; then
                echo "Reader Session Controls exception denied: unapproved changes after the reviewed commit:"
                echo "$RSC_DELTA"
                exit 1
              fi
              RSC_EXCEPTION=1
              echo "Reader Session Controls exception verified: approved dependency blobs (69f7972e/b4a01df0), reviewed commit is ancestor, workflow-only delta."
            elif [ "${GITHUB_REPOSITORY:-}" = "pattaramet-tech/ipenovel" ] && [ "${GITHUB_EVENT_NAME:-}" = "pull_request" ] && [ "${GITHUB_BASE_REF:-}" = "main" ]; then
              EVENT_HEAD_REPO="$(jq -r '.pull_request.head.repo.full_name // ""' "$GITHUB_EVENT_PATH")"
              EVENT_HEAD_SHA="$(jq -r '.pull_request.head.sha // ""' "$GITHUB_EVENT_PATH")"
              EVENT_BASE_SHA="$(jq -r '.pull_request.base.sha // ""' "$GITHUB_EVENT_PATH")"
              if [ "$EVENT_HEAD_REPO" != "pattaramet-tech/ipenovel" ] || [ -z "$EVENT_HEAD_SHA" ] || [ -z "$EVENT_BASE_SHA" ]; then
                echo "Post-merge compatibility check denied: malformed or missing event provenance"
                exit 1
              fi
              if ! git merge-base --is-ancestor "$R5_COMMIT" "$EVENT_BASE_SHA"; then
                echo "Post-merge compatibility check denied: main base is not a descendant of the approved Reader Session Controls merge commit"
                exit 1
              fi
              if [ "$(git rev-parse HEAD^1 2>/dev/null || true)" != "$EVENT_BASE_SHA" ] || [ "$(git rev-parse HEAD^2 2>/dev/null || true)" != "$EVENT_HEAD_SHA" ]; then
                echo "Post-merge compatibility check denied: synthetic merge parents do not match the event base/head SHAs"
                exit 1
              fi
              if [ "$(git rev-parse "$EVENT_BASE_SHA:package.json")" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse "$EVENT_BASE_SHA:pnpm-lock.yaml")" != "$APPROVED_LOCK_BLOB" ] || [ "$(git rev-parse "HEAD:package.json")" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse "HEAD:pnpm-lock.yaml")" != "$APPROVED_LOCK_BLOB" ] || [ "$(git rev-parse "$EVENT_HEAD_SHA:package.json")" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse "$EVENT_HEAD_SHA:pnpm-lock.yaml")" != "$APPROVED_LOCK_BLOB" ]; then
                echo "Post-merge compatibility check denied: dependency blob changed after the approved Reader Session Controls merge (pending its own separate approval)"
                exit 1
              fi
              if [ -n "$(git diff --name-only "$EVENT_BASE_SHA" "$EVENT_HEAD_SHA" -- package.json pnpm-lock.yaml)" ]; then
                echo "Post-merge compatibility check denied: this PR introduces dependency changes (pending its own separate approval)"
                exit 1
              fi
              RSC_EXCEPTION=1
              echo "Post-merge compatibility verified: R5 ancestry, approved dependency blobs at base/head/merge, no dependency changes in this PR."
            elif [ "${GITHUB_REPOSITORY:-}" = "pattaramet-tech/ipenovel" ] && [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${GITHUB_REF:-}" = "refs/heads/main" ] && [ "${GITHUB_SHA:-}" = "$(git rev-parse HEAD)" ] && git merge-base --is-ancestor "$R5_COMMIT" HEAD; then
              if [ "$(git rev-parse HEAD:package.json)" != "$APPROVED_PKG_BLOB" ] || [ "$(git rev-parse HEAD:pnpm-lock.yaml)" != "$APPROVED_LOCK_BLOB" ]; then
                echo "Post-merge main dispatch denied: dependency blob changed after the approved Reader Session Controls merge"
                exit 1
              fi
              RSC_EXCEPTION=1
              echo "Post-merge main dispatch verified: R5 ancestry and approved dependency blobs."
            fi
            if [ "$RSC_EXCEPTION" = "1" ]; then
              echo "Dependency exception policy satisfied."
            else
              echo "M29.3 must not add dependencies without separate review."
              exit 1
            fi
          fi
