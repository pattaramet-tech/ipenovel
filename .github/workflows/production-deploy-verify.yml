name: Production Deployment Verification

on:
  repository_dispatch:
    types:
      - production-deployed

permissions:
  contents: read
  statuses: write

concurrency:
  group: production-deployment-verification
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact Production deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_CANDIDATE_SHA: ${{ github.event.client_payload.deployed_sha || '' }}
      PRODUCTION_DISPATCH_ENVIRONMENT: ${{ github.event.client_payload.environment || '' }}
      PRODUCTION_BASE_URL: https://ipenovel.com
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verification control plane
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate Production dispatch identity
        run: |
          test "$PRODUCTION_DISPATCH_ENVIRONMENT" = "production" || {
            echo "Refusing non-production dispatch environment"
            exit 1
          }

      - name: Mark Production deployment verification pending
        run: node scripts/production-promotion-status.mjs verification pending

      - name: Verify authorized revision is live on Production
        run: node scripts/production-deployment-verify.mjs

  verification-status:
    name: Record Production deployment verification
    if: ${{ always() }}
    needs:
      - verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRODUCTION_CANDIDATE_SHA: ${{ github.event.client_payload.deployed_sha || '' }}
      PRODUCTION_RESULT: ${{ needs.verify.result }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout verification control plane
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Record final verification status
        run: node scripts/production-promotion-status.mjs verification final
