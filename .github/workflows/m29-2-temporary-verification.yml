name: M29.2 Temporary Verification

on:
  push:
    branches:
      - feat/nqa-m29-2-structural-anomaly-check

permissions:
  contents: read

concurrency:
  group: m29-2-temporary-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/ipenovel_test
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/ipenovel_test
      VITE_PAYMENT_QR_IMAGE_URL: https://pub-example.r2.dev/payment/qr.jpg
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ipenovel_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: M29.2 targeted and adjacent regression
        run: >-
          pnpm exec vitest run
          server/workspace/editorialStructuralAnomaly.domain.test.ts
          server/workspace/editorialStructuralAnomaly.static.test.ts
          server/workspace/editorialStructuralAnomaly.service.integration.test.ts
          server/workspace/editorialForeignChecker.domain.test.ts
          server/workspace/editorialForeignChecker.static.test.ts
          server/workspace/editorialForeignChecker.service.integration.test.ts
          server/workspace/editorialApproval.static.test.ts
          server/workspace/editorialBulkFindingCleanup.domain.test.ts
          server/workspace/editorialBulkFindingCleanup.static.test.ts
          server/workspace/editorialBulkFindingCleanup.service.integration.test.ts
          server/migration-deployment-safety.test.ts
          server/migration-legacy-pending-chain-static.test.ts

      - name: Full CI regression (baseline diagnostic)
        continue-on-error: true
        run: pnpm test:ci

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Diff and secret safety scan
        shell: bash
        run: |
          set -euo pipefail
          git diff --check f7c6434d4f15345db27964d9f0001348ee475ba7...HEAD
          changed="$(git diff --name-only f7c6434d4f15345db27964d9f0001348ee475ba7...HEAD)"
          if [ -n "$changed" ] && git grep -n $'\uFFFD' -- $changed; then
            echo "U+FFFD replacement character found in changed files"
            exit 1
          fi
          if git diff --unified=0 f7c6434d4f15345db27964d9f0001348ee475ba7...HEAD | grep -E '^\+.*BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'; then
            echo "Private key material detected in diff"
            exit 1
          fi
          if ! git diff --quiet f7c6434d4f15345db27964d9f0001348ee475ba7...HEAD -- package.json pnpm-lock.yaml; then
            echo "M29.2 must not add dependencies without separate review."
            exit 1
          fi

      - name: Dependency audit (baseline diagnostic)
        continue-on-error: true
        run: pnpm audit --audit-level=high
